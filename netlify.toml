# Netlify: builds and hosts the web version of the game (free plan).
# In the Netlify site settings add the variable EXPO_PUBLIC_BACKEND_URL = address of the server
# (for example https://mostrelli-api.onrender.com), then deploy.
[build]
  base = "frontend"
  command = "npx expo export -p web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: every address opens the game, which then shows the right screen.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker and the page must always be fresh, so updates arrive at once.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
# Game files have a unique name per version: they can be cached for a year.
[[headers]]
  for = "/_expo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
