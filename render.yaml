# Render: runs the game server (free plan). New > Blueprint > pick this repository.
# Fill in the two secret values when Render asks for them:
#   MONGO_URL  = connection string of your free MongoDB Atlas database
#   JWT_SECRET = any long random text (keeps logins safe)
services:
  - type: web
    name: mostrelli-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DB_NAME
        value: mostrelli
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
